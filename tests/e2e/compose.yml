services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zara_e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: disposable-e2e-password
    healthcheck:
      test: [CMD-SHELL, pg_isready -U e2e -d zara_e2e]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.2.14-alpine
  mail:
    image: node:22-alpine
    volumes:
      - ./mail.mjs:/mail.mjs:ro
    command: [node, /mail.mjs]
  migrate:
    build:
      context: ../..
      target: api
    environment:
      DATABASE_URL: postgresql://e2e:disposable-e2e-password@db:5432/zara_e2e
    command: [npm, run, db:migrate]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ../..
      target: api
    environment:
      NODE_ENV: production
      ZARA_ENV: local
      DATABASE_URL: postgresql://e2e:disposable-e2e-password@db:5432/zara_e2e
      BETTER_AUTH_SECRET: disposable-e2e-auth-secret-not-for-production
      BETTER_AUTH_URL: https://127.0.0.1:8443
      ZARA_TRUSTED_ORIGINS: https://127.0.0.1:8443
      ZARA_AUTH_EMAIL_WEBHOOK_URL: http://mail:8025/messages
      POLAR_WEBHOOK_SECRET: disposable-e2e-webhook-secret
      POLAR_SERVER: sandbox
      BILLING_CHARGE_DELIVERY_ENABLED: "false"
      PSTN_ADMISSION_REDIS_URL: redis://redis:6379
      PORT: "4010"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      mail:
        condition: service_started
  web:
    build:
      context: ../..
      target: web
      args:
        VITE_API_BASE_URL: https://127.0.0.1:8443
        VITE_AUTH_BASE_URL: https://127.0.0.1:8443
  gateway:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [api, web]
    networks: [default, browser]
networks:
  default:
    internal: true
  browser: {}
