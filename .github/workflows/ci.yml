name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2.14-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zara
      ZARA_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Executable repository contracts
        run: npm run validate:contracts

      - name: Test-suite boundaries
        run: npm run test:boundaries

      - name: Build production container targets
        run: |
          docker build --check .
          docker build --target api -t zara-api:ci .
          docker build --target realtime-worker -t zara-realtime-worker:ci .
          docker build --target web -t zara-web:ci .
          docker build --target platform-admin -t zara-platform-admin:ci .

      - name: Test
        run: npm run test:run

      - name: Redis PSTN admission qualification
        run: npm exec -- vitest run apps/api/src/telephony/redis-pstn-call-admission.redis.test.ts

      - name: Runtime eval gate
        run: npm run eval:runtime

      - name: PSTN eval gate
        run: npm run eval:pstn

      - name: Migration check
        run: npm run db:check
